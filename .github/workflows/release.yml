name: Enterprise Release Pipeline

on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build, Test and Push Image
    runs-on: ubuntu-latest

    outputs:
      image: ${{ steps.image.outputs.image }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Dependencies
        working-directory: app
        run: npm install

      - name: Run Tests
        working-directory: app
        run: npm test

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker Image
        run: |
          docker build \
            -f docker/Dockerfile \
            -t enterprise-release-api:${{ github.sha }} .

      - name: Tag Docker Image
        run: |
          docker tag enterprise-release-api:${{ github.sha }} \
          417067938602.dkr.ecr.eu-west-1.amazonaws.com/enterprise-release-api:${{ github.sha }}

      - name: Push Docker Image
        run: |
          docker push \
          417067938602.dkr.ecr.eu-west-1.amazonaws.com/enterprise-release-api:${{ github.sha }}

      - name: Save Image Name
        id: image
        run: |
          echo "image=417067938602.dkr.ecr.eu-west-1.amazonaws.com/enterprise-release-api:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
