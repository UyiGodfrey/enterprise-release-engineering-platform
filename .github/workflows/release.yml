name: Enterprise Release Pipeline

permissions:
  contents: write

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Dependencies
        working-directory: app
        run: npm install

      - name: Run Tests
        working-directory: app
        run: npm test

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker Image
        run: |
          docker build \
          -f docker/Dockerfile \
          -t enterprise-release-api:${{ github.sha }} .

      - name: Tag Docker Image
        run: |
          docker tag enterprise-release-api:${{ github.sha }} \
          417067938602.dkr.ecr.eu-west-1.amazonaws.com/enterprise-release-api:${{ github.sha }}

      - name: Push Docker Image
        run: |
          docker push 417067938602.dkr.ecr.eu-west-1.amazonaws.com/enterprise-release-api:${{ github.sha }}

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
          --region eu-west-1 \
          --name enterprise-release-cluster

      - name: Verify Cluster Connection
        run: |
          kubectl get nodes

      - name: Deploy to Dev
        run: |
          kubectl set image deployment/enterprise-release-api \
          enterprise-release-api=417067938602.dkr.ecr.eu-west-1.amazonaws.com/enterprise-release-api:${{ github.sha }} \
          -namespace dev
          
      - name: Wait for Rollout
        run: |
          kubectl rollout status deployment/enterprise-release-api -n dev
      

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
            generate_release_notes: true