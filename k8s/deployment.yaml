apiVersion: apps/v1
kind: Deployment

metadata:
  name: enterprise-release-api
  namespace: enterprise-release

spec:
  replicas: 2

  selector:
    matchLabels:
      app: enterprise-release-api

  template:
    metadata:
      labels:
        app: enterprise-release-api

    spec:
      containers:
        - name: enterprise-release-api

          image: 417067938602.dkr.ecr.eu-west-1.amazonaws.com/enterprise-release-api:v1.0.0

          ports:
            - containerPort: 8080